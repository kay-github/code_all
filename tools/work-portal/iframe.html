<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edf6fa">
  <meta name="referrer" content="no-referrer">
  <title>工作台 · 内嵌模式</title>
  <link rel="stylesheet" href="/tools/work-portal/iframe.css">
  <script src="/tools/work-portal/shared.js" defer></script>
  <script src="/tools/work-portal/iframe.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/" aria-label="工作台，返回首页"><span class="brand-icon" aria-hidden="true">▦</span><span>工作台 <small>内嵌模式</small></span></a><a class="back" href="/">返回首页 ↗</a></header>
  <main>
    <section class="switcher" aria-labelledby="switch-title"><div class="switch-heading"><h1 id="switch-title">常用功能</h1><span id="entry-count"></span></div><p id="load-status" class="status" role="status">正在加载常用功能…</p><button id="retry-load" class="primary" type="button" hidden>重新加载</button><nav id="switch-buttons" aria-label="切换功能页"></nav></section>
    <section id="viewer" class="viewer" aria-label="功能页内容" hidden>
      <div class="viewer-bar"><h2 id="active-name"></h2><div class="viewer-actions"><button id="reload-frame" class="quiet" type="button" aria-label="重新载入" title="重新载入">↻</button><a id="open-page" class="primary" target="_blank" rel="noopener noreferrer" aria-label="新窗口打开" title="新窗口打开">新窗口 ↗</a><details class="embed-help"><summary aria-label="查看入口说明" title="查看入口说明">?</summary><div class="help-content"><p id="active-remark"></p><p>部分页面需要登录或不支持内嵌。如未显示，请使用“新窗口打开”。</p></div></details></div></div>
      <div id="frame-area" class="frame-area"><iframe id="content-frame" title="功能页" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-top-navigation-by-user-activation" hidden></iframe><div id="frame-fallback" class="frame-fallback" hidden><span class="fallback-icon" aria-hidden="true">↗</span><h3>请在新窗口访问此入口</h3><p id="fallback-message"></p><a id="fallback-open" class="primary" target="_blank" rel="noopener noreferrer">新窗口打开 ↗</a></div></div>
    </section>
  </main>
</body>
</html>
