name: optical-daily-update

# GitHub 的 schedule 不是准点闹钟：实测延迟 9～18 小时是常态（11-26/11-27 的
# 15:01/16:05 窗口实际落在北京中午 12:23 和次日凌晨 01:00-02:14）。
# 因此不再用“墙上时钟窗口”当闸门，改为“数据是否过期”闸门：
#   gate 读出仓库里已有的 data_date，算出最近一个已收盘交易日（expect），
#   只有 data_date < expect 且当前不在盘中（09:30-15:00）才真正抓数。
# 这样 schedule 无论延迟到几点（含次日凌晨、周末），只要线上数据落后就会补上；
# 已是最新则直接退出，不装依赖不抓数。verify 再要求新数据严格比旧数据新，
# 且 intraday=false，避免节假日/停市把旧值重复提交。

on:
  schedule:
    # 工作日每小时一次（UTC 每小时第 5 分）。hourly 是关键：schedule 延迟实测在
    # 5~10 小时之间浮动，固定几个点必然被整段跳过；每小时都有机会落在 15:05 之后。
    - cron: '5 * * * 1-5'
    # 周末三次补漏（北京 09:00 / 15:00 / 21:00），补周五或节假日的缺口
    - cron: '5 1,7,13 * * 6,0'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略数据闸门（仅手动补跑用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: optical-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/optical-decline-board/光通信跌幅榜_数据.json
          sparse-checkout-cone-mode: false

      - name: Decide whether the board is stale
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual force: bypass data gate"
            exit 0
          fi

          BJ_DATE=$(TZ=Asia/Shanghai date +%F)
          BJ_WDAY=$(TZ=Asia/Shanghai date +%u)
          BJ_HM=$(TZ=Asia/Shanghai date +%H%M)
          OLD=$(python3 -c "import json;print(json.load(open('tools/optical-decline-board/光通信跌幅榜_数据.json',encoding='utf-8'))['meta']['data_date'])")
          echo "Beijing now: $(TZ=Asia/Shanghai date '+%F %T weekday=%u') | board data_date=${OLD}"

          # 盘中（09:30-15:00）当日行情未定稿，一律不抓
          IN_SESSION=0
          if [ "$BJ_WDAY" -le 5 ] && [ "$((10#$BJ_HM))" -ge 930 ] && [ "$((10#$BJ_HM))" -lt 1500 ]; then
            IN_SESSION=1
          fi

          # 最近一个已收盘交易日：今天工作日且已过 15:05 取今天，否则往前推到上个工作日
          if [ "$BJ_WDAY" -le 5 ] && [ "$((10#$BJ_HM))" -ge 1505 ]; then
            EXPECT=$BJ_DATE
          else
            EXPECT=$(TZ=Asia/Shanghai date -d "$BJ_DATE -1 day" +%F)
            while [ "$(TZ=Asia/Shanghai date -d "$EXPECT" +%u)" -ge 6 ]; do
              EXPECT=$(TZ=Asia/Shanghai date -d "$EXPECT -1 day" +%F)
            done
          fi
          echo "expect_latest_trading_day=${EXPECT} in_session=${IN_SESSION}"

          if [ "$IN_SESSION" -eq 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip: in-session, quotes are not final"
          elif [[ "$OLD" < "$EXPECT" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "run: board ${OLD} lags ${EXPECT}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip: board ${OLD} already covers ${EXPECT}"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # GitHub runner 默认 UTC；脚本用 datetime.now() 判断盘中/收盘，必须锁北京时间
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests pandas akshare

      - name: Fetch & build board
        working-directory: tools/optical-decline-board
        env:
          OPTICAL_BASE: .
        run: |
          python pipeline/光通信跌幅扫描_抓数.py
          python pipeline/光通信跌幅扫描_出表.py
          python pipeline/光通信跌幅看板_生成.py
          cp 光通信板块跌幅榜_最新.html index.html
          mkdir -p archive
          find . -maxdepth 1 \( -name '光通信板块跌幅榜_2*' -o -name '科技股跌幅榜_2*' -o -name '消费股跌幅榜_2*' \) -exec mv {} archive/ \;
          echo "---- 产物 ----"
          ls -la index.html archive/ | head -20

      - name: Verify data date
        id: verify
        working-directory: tools/optical-decline-board
        run: |
          BJ_TODAY=$(TZ=Asia/Shanghai date +%F)
          DATA_DATE=$(python3 -c "import json;print(json.load(open('光通信跌幅榜_数据.json',encoding='utf-8'))['meta']['data_date'])")
          INTRADAY=$(python3 -c "import json;print(json.load(open('光通信跌幅榜_数据.json',encoding='utf-8'))['meta']['intraday'])")
          OLD=$(git -C "$GITHUB_WORKSPACE" show HEAD:tools/optical-decline-board/光通信跌幅榜_数据.json | python3 -c "import sys,json;print(json.load(sys.stdin)['meta']['data_date'])")
          echo "data_date=${DATA_DATE} old=${OLD} bj_today=${BJ_TODAY} intraday=${INTRADAY}"
          if [ "$INTRADAY" = "False" ] && [[ "$DATA_DATE" > "$OLD" ]] && { [[ "$DATA_DATE" < "$BJ_TODAY" ]] || [ "$DATA_DATE" = "$BJ_TODAY" ]; }; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "skip commit: need intraday=false, data_date newer than ${OLD} and not later than ${BJ_TODAY}"
          fi

      - name: Commit & push
        if: steps.verify.outputs.match == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_DATE=$(python3 -c "import json;print(json.load(open('tools/optical-decline-board/光通信跌幅榜_数据.json',encoding='utf-8'))['meta']['data_date'])")
          git add tools/optical-decline-board
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Daily optical decline board update ${DATA_DATE}"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                echo "pushed on attempt ${attempt}"
                break
              fi
              echo "push attempt ${attempt} failed; retry after 5s"
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "push failed after 3 attempts"
              exit 1
            fi
          fi
