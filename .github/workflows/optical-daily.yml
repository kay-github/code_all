name: optical-daily-update

# GitHub 的 schedule 不是准点闹钟：实测经常延迟 9～12 小时，偶尔更久。
# 因此不再只押 15:01 / 16:05 两个点，而是铺两组窗口：
#   1) UTC 07:01-07:46（北京 15:01-15:46）：覆盖 0～8 小时延迟；
#   2) UTC 前一日 22:30-23:15（北京 06:30-07:15）：覆盖 9～17 小时延迟，
#      延迟后正好落到北京 15:30-24:15。
# 每个 run 先过“北京工作日 15:10-23:59”闸门；不在窗口内直接退出，不装依赖、不抓数。
# 抓完后再校验 data_date 必须等于北京今天，避免节假日/停市把旧数据提交上去。

on:
  schedule:
    - cron: '1 7 * * 1-5'
    - cron: '16 7 * * 1-5'
    - cron: '31 7 * * 1-5'
    - cron: '46 7 * * 1-5'
    - cron: '5 8 * * 1-5'
    - cron: '30 22 * * 0-4'
    - cron: '45 22 * * 0-4'
    - cron: '0 23 * * 0-4'
    - cron: '15 23 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略北京时间闸门（仅手动补跑用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: optical-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check Beijing close window
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual force: bypass time gate"
            exit 0
          fi
          BJ_DAY=$(TZ=Asia/Shanghai date +%u)
          BJ_HM=$(TZ=Asia/Shanghai date +%H%M)
          echo "Beijing now: $(TZ=Asia/Shanghai date '+%F %T weekday=%u')"
          if [ "$BJ_DAY" -ge 1 ] && [ "$BJ_DAY" -le 5 ] && [ "$((10#$BJ_HM))" -ge 1510 ] && [ "$((10#$BJ_HM))" -le 2359 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip: outside Beijing weekday 15:10-23:59"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # GitHub runner 默认 UTC；脚本用 datetime.now() 判断盘中/收盘，必须锁北京时间
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests pandas akshare

      - name: Fetch & build board
        working-directory: tools/optical-decline-board
        env:
          OPTICAL_BASE: .
        run: |
          python pipeline/光通信跌幅扫描_抓数.py
          python pipeline/光通信跌幅扫描_出表.py
          python pipeline/光通信跌幅看板_生成.py
          cp 光通信板块跌幅榜_最新.html index.html
          mkdir -p archive
          find . -maxdepth 1 \( -name '光通信板块跌幅榜_2*' -o -name '科技股跌幅榜_2*' -o -name '消费股跌幅榜_2*' \) -exec mv {} archive/ \;
          echo "---- 产物 ----"
          ls -la index.html archive/ | head -20

      - name: Verify data date
        id: verify
        working-directory: tools/optical-decline-board
        run: |
          BJ_TODAY=$(TZ=Asia/Shanghai date +%F)
          DATA_DATE=$(python -c "import json; print(json.load(open('光通信跌幅榜_数据.json', encoding='utf-8'))['meta']['data_date'])")
          INTRADAY=$(python -c "import json; print(json.load(open('光通信跌幅榜_数据.json', encoding='utf-8'))['meta']['intraday'])")
          echo "data_date=${DATA_DATE} bj_today=${BJ_TODAY} intraday=${INTRADAY}"
          if [ "$DATA_DATE" = "$BJ_TODAY" ] && [ "$INTRADAY" = "False" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "skip commit: data_date is not Beijing today, or intraday is still true"
          fi

      - name: Commit & push
        if: steps.verify.outputs.match == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_DATE=$(python -c "import json; print(json.load(open('tools/optical-decline-board/光通信跌幅榜_数据.json', encoding='utf-8'))['meta']['data_date'])")
          git add tools/optical-decline-board
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Daily optical decline board update ${DATA_DATE}"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                echo "pushed on attempt ${attempt}"
                break
              fi
              echo "push attempt ${attempt} failed; retry after 5s"
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "push failed after 3 attempts"
              exit 1
            fi
          fi
