name: ETF market flow premarket

on:
  schedule:
    # 北京时间 09:10 / 09:40 / 10:10 / 11:10（UTC 1-3 点）；多窗口抵御 GitHub schedule 延迟。
    - cron: '10 1 * * 1-6'
    - cron: '40 1 * * 1-6'
    - cron: '10 2 * * 1-6'
    - cron: '10 3 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-market-flow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r apps/national-team-etf/market_flow/requirements-market-flow.txt
      - name: Build auxiliary report
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 apps/national-team-etf/market_flow/market_flow_update.py \
            --out tools/national-team-etf/data/market_flow
      - name: Commit auxiliary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/national-team-etf/data/market_flow
          if git diff --cached --quiet; then
            echo "no auxiliary data change"
            exit 0
          fi
          git commit -m "Update all-market ETF flow background"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
