name: Market pulse morning

on:
  push:
    paths:
      - '.github/workflows/market-pulse-morning.yml'
      - 'tools/market-pulse/pipeline/requirements.txt'
  schedule:
    # GitHub cron is UTC. 03:36-04:36 UTC = 11:36-12:36 Beijing. Five slots
    # absorb schedule delays; run_daily refuses anything before 11:35 or after 13:00.
    - cron: '36,51 3 * * 1-5'
    - cron: '6,21,36 4 * * 1-5'
  # Market tracker updates has a cloud clock at 12:23 Beijing (04:23 UTC).
  # This is a direct second trigger; 11:20 / afternoon completions are skipped
  # by run_daily's morning window and are harmless.
  workflow_run:
    workflows: ['Market tracker updates']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-pulse-morning
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/market-pulse/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/market-pulse/pipeline/requirements.txt

      - name: Build today's morning snapshot
        env:
          TZ: Asia/Shanghai
          MP_SESSION: am
          MP_ROOT: ${{ github.workspace }}/tools/market-pulse/pipeline
          MP_OUT_DIR: ${{ github.workspace }}/tools/market-pulse
          MP_ONLINE: '1'
          PYTHONUNBUFFERED: '1'
        run: python tools/market-pulse/pipeline/scripts/run_daily.py

      - name: Commit morning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/market-pulse/data/am tools/market-pulse/data/index.json tools/market-pulse/pipeline/run_status_am.json
          if git diff --cached --quiet; then
            echo "No morning data changes"
            exit 0
          fi
          git commit -m "pulse: morning $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git -c rebase.autostash=true pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Commit morning run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/market-pulse/pipeline/run_status_am.json || true
          if git diff --cached --quiet; then
            echo "No morning status changes"
            exit 0
          fi
          git commit -m "pulse: morning status $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
