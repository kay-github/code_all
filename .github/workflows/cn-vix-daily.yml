name: CNVIX daily update

on:
  schedule:
    # Beijing time 15:50 / 16:50, weekdays. Second slot is the fallback.
    - cron: '50 7 * * 1-5'
    - cron: '50 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnvix-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild CNVIX series
        run: python tools/cn-vix/update.py --days 10
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/cn-vix/data/cnvix.json tools/cn-vix/data/history.csv
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "cnvix: update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
