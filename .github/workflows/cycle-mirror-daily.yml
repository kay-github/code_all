name: Cycle mirror daily update

on:
  schedule:
    # 北京时间 15:20 / 16:10，工作日；第二个时点是兜底
    - cron: '20 7 * * 1-5'
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cycle-mirror-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build mirror data
        run: python tools/cycle-mirror/update.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/cycle-mirror/data/mirror.json tools/cycle-mirror/data/sh000001.csv tools/cycle-mirror/data/cn985.csv tools/cycle-mirror/data/baseline.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "mirror: update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
