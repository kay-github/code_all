name: Market tracker updates
run-name: Market trackers · ${{ inputs.task || github.event.schedule }}

on:
  schedule:
    # Beijing time. Later slots give delayed or incomplete sources another chance.
    - cron: '7 2 * * 1-6'   # ETF final 10:07, including Saturday
    - cron: '23 4 * * 1-6'  # ETF final 12:23 fallback
    - cron: '17,39 6 * * 1-5'  # ETF intraday snapshots 14:17 and 14:39
    - cron: '33 11 * * 1-5' # ETF provisional 19:33
    - cron: '13 13 * * 1-5' # ETF provisional 21:13 fallback
    - cron: '43 0 * * 1-6'  # Fund NAV 08:43, including Saturday
    - cron: '19 3 * * 1-6'  # Fund NAV 11:19 fallback
    - cron: '11,41 * * * *'  # Catch-up selects tasks by the runner's actual Beijing time
  workflow_dispatch:
    inputs:
      task:
        description: Pipeline or verification to run
        type: choice
        options: [probe, verify, etf-final, etf-close, etf-intraday, fund]
        default: probe
      rebuild:
        description: Rebuild the latest verified business day if already published
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - id: select
        env:
          MANUAL_TASK: ${{ inputs.task }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          tasks=()
          if [[ -n "$SCHEDULE" ]]; then
            read -r weekday clock < <(TZ=Asia/Shanghai date '+%u %H%M')
            hhmm=$((10#$clock))
          fi
          case "$SCHEDULE" in
            '7 2 * * 1-6'|'23 4 * * 1-6') tasks=(etf-final) ;;
            '17,39 6 * * 1-5') tasks=(etf-intraday) ;;
            '33 11 * * 1-5'|'13 13 * * 1-5') tasks=(etf-close) ;;
            '43 0 * * 1-6'|'19 3 * * 1-6') tasks=(fund) ;;
            '11,41 * * * *')
              if (( weekday <= 6 && hhmm >= 900 && hhmm < 1345 )); then
                tasks+=(fund)
              fi
              if (( weekday <= 6 && hhmm >= 1020 && hhmm < 1420 )); then
                tasks+=(etf-final)
              fi
              if (( weekday <= 5 && hhmm >= 1420 && hhmm < 1500 )); then
                tasks+=(etf-intraday)
              fi
              ;;
            '')
              case "$MANUAL_TASK" in
                etf-final|etf-intraday|etf-close|fund|probe|verify) tasks=("$MANUAL_TASK") ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          # A delayed scheduled event is still an opportunity to publish today's close.
          if [[ -n "$SCHEDULE" ]] && (( weekday <= 5 && hhmm >= 1900 )); then
            case "${tasks[*]}" in
              etf-close) ;;
              etf-intraday) tasks=(etf-close) ;;
              *) tasks+=(etf-close) ;;
            esac
          fi
          # After the morning window, every scheduled runner also checks the latest
          # formal day. This backfills when GitHub delays or drops the 10:07/12:23 runs.
          if [[ -n "$SCHEDULE" ]] && (( weekday <= 6 && hhmm >= 1020 )); then
            case " ${tasks[*]} " in
              *" etf-final "*) ;;
              *) tasks+=(etf-final) ;;
            esac
          fi
          selection='[]'
          if (( ${#tasks[@]} )); then
            printf -v list '"%s",' "${tasks[@]}"
            selection="[${list%,}]"
          fi
          printf 'tasks=%s\n' "$selection" >> "$GITHUB_OUTPUT"

  update:
    needs: select
    if: needs.select.outputs.tasks != '[]'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.select.outputs.tasks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Shanghai
    concurrency:
      group: market-tracker-${{ startsWith(matrix.task, 'etf-') && 'etf' || matrix.task }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fund dependencies
        if: matrix.task == 'fund'
        run: python -m pip install -r apps/fund-dragon-recovery/requirements.txt

      - name: Collect, validate, publish and verify
        env:
          TASK: ${{ matrix.task }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=("$TASK")
          if [[ "$REBUILD" == "true" ]]; then args+=(--rebuild); fi
          python -u -X utf8 scripts/market-cloud-update.py "${args[@]}"

      - name: Retain ETF validation and provenance
        if: always() && startsWith(matrix.task, 'etf-')
        uses: actions/upload-artifact@v4
        with:
          name: etf-update-audit
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/national-team-etf/data/v2/raw/*/manifest.json
            apps/national-team-etf/data/v2/raw/*/exchange/
            apps/national-team-etf/data/v2/builds/*/acceptance.json
            apps/national-team-etf/data/v2/builds/*/release_gate.json
            apps/national-team-etf/data/intraday/*/snapshots.jsonl

      - name: Retain fund validation and provenance
        if: always() && matrix.task == 'fund'
        uses: actions/upload-artifact@v4
        with:
          name: fund-update-audit
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/fund-dragon-recovery/data/v3/raw/*/manifest.json
            apps/fund-dragon-recovery/data/v3/builds/*/acceptance.json
            apps/fund-dragon-recovery/data/v3/builds/*/release_gate.json
