name: Market pulse daily

on:
  push:
    paths:
      - '.github/workflows/market-pulse-daily.yml'
      - 'tools/market-pulse/pipeline/requirements.txt'
  schedule:
    # Beijing 16:10 / 17:10 / 18:10, weekdays. Each later run is a fallback and refreshes LHB.
    - cron: '10 8 * * 1-5'
    - cron: '10 9 * * 1-5'
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-pulse-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/market-pulse/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/market-pulse/pipeline/requirements.txt

      - name: Build today's market pulse
        env:
          TZ: Asia/Shanghai
          MP_ROOT: ${{ github.workspace }}/tools/market-pulse/pipeline
          MP_OUT_DIR: ${{ github.workspace }}/tools/market-pulse
          MP_ONLINE: '1'
          PYTHONUNBUFFERED: '1'
        run: python tools/market-pulse/pipeline/scripts/run_daily.py

      - name: Commit page and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/market-pulse/index.html tools/market-pulse/app.js tools/market-pulse/echarts-boot.js tools/market-pulse/data/latest.js tools/market-pulse/data/latest.json tools/market-pulse/data/archive tools/market-pulse/pipeline/run_status.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "pulse: update $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git -c rebase.autostash=true pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Commit run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/market-pulse/pipeline/run_status.json
          if git diff --cached --quiet; then
            echo "No status changes"
            exit 0
          fi
          git commit -m "pulse: run status $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
