name: Market pulse cloud watchdog

# Cloud-only freshness guard for /pulse. It never runs the pipeline itself: it
# checks the live data and asks GitHub Actions to dispatch the normal morning
# or close workflow when today's node is missing/stale. No PAT or local machine
# is involved; the job uses the repository-scoped GITHUB_TOKEN.
#
# The frequent schedule covers GitHub cron delays. The workflow_run listener on
# top-radar-daily is a second clock around 15:10/16:10 Beijing, independent of
# the pulse schedules. pulse -> market-trackers is already one-way; top-radar
# does not listen to pulse, so this chain cannot loop.

on:
  schedule:
    # UTC 03:00-13:50 = Beijing 11:00-21:50, every 10 minutes on weekdays.
    - cron: '*/10 3-13 * * 1-5'
  workflow_run:
    workflows: ['top-radar-daily']
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pulse-cloud-watchdog.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: market-pulse-cloud-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check freshness and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="https://1.688680.xyz/tools/market-pulse/data"
          API="https://api.github.com/repos/${REPO}/actions/workflows"

          read -r wd hhmm < <(TZ=Asia/Shanghai date '+%u %H%M')
          hhmm=$((10#$hhmm))
          today=$(TZ=Asia/Shanghai date +%F)

          if (( wd > 5 )); then
            echo "weekend ($today), skip"
            exit 0
          fi
          if (( hhmm < 1135 || hhmm > 2200 )); then
            echo "outside pulse windows ($today $hhmm), skip"
            exit 0
          fi

          fetch_json() {
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$1?ts=$(date +%s)" 2>/dev/null || true
          }
          stamp_hhmm() {
            local stamp="${1:-}"
            [[ -n "$stamp" ]] || { echo 0000; return; }
            TZ=Asia/Shanghai date -d "$stamp" '+%H%M' 2>/dev/null || echo 0000
          }

          pm_json=$(fetch_json "$BASE/latest.json")
          am_json=$(fetch_json "$BASE/am/latest.json")

          pm_date=$(jq -r '.date // ""' <<<"$pm_json" 2>/dev/null || true)
          am_date=$(jq -r '.date // ""' <<<"$am_json" 2>/dev/null || true)
          pm_stamp=$(jq -r '.rendered_at // .generated_at // ""' <<<"$pm_json" 2>/dev/null || true)
          am_stamp=$(jq -r '.rendered_at // .generated_at // ""' <<<"$am_json" 2>/dev/null || true)
          pm_hhmm=$(stamp_hhmm "$pm_stamp")
          am_hhmm=$(stamp_hhmm "$am_stamp")
          pm_hhmm=$((10#$pm_hhmm))
          am_hhmm=$((10#$am_hhmm))

          echo "beijing=$today $hhmm pm=$pm_date/$pm_hhmm am=$am_date/$am_hhmm"

          active() {
            local wf="$1"
            local body status
            body=$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${API}/${wf}/runs?per_page=1" 2>/dev/null || true)
            status=$(jq -r '.workflow_runs[0].status // ""' <<<"$body" 2>/dev/null || true)
            case "$status" in
              in_progress|queued|requested|waiting|pending) return 0 ;;
              *) return 1 ;;
            esac
          }

          dispatch() {
            local wf="$1" code
            echo "dispatching ${wf}"
            code=$(curl -sS --max-time 20 -o /tmp/pulse-dispatch-response \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}/${wf}/dispatches" \
              -d '{"ref":"main"}' || true)
            echo "dispatch ${wf} HTTP ${code} $(cat /tmp/pulse-dispatch-response 2>/dev/null || true)"
            [[ "$code" == "204" ]]
          }

          # Morning: 11:35-13:00. A same-day snapshot before 11:30 is useless.
          if (( hhmm >= 1135 && hhmm <= 1300 )); then
            if [[ "$am_date" != "$today" || "$am_hhmm" -lt 1130 ]]; then
              if active market-pulse-morning.yml; then
                echo "morning workflow already active, skip"
              else
                dispatch market-pulse-morning.yml || true
              fi
            else
              echo "morning data fresh, skip"
            fi
          fi

          # Close: 16:10-22:00. A same-day file rendered before 16:00 is only
          # an early/incomplete close snapshot; ask for one proper rerun.
          if (( hhmm >= 1610 && hhmm <= 2200 )); then
            if [[ "$pm_date" != "$today" || "$pm_hhmm" -lt 1600 ]]; then
              if active market-pulse-daily.yml; then
                echo "close workflow already active, skip"
              else
                dispatch market-pulse-daily.yml || true
              fi
            else
              echo "close data fresh, skip"
            fi
          fi
