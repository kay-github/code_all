name: Wave tracker daily update

on:
  schedule:
    # Trading weekdays, Beijing time 15:42 and 16:36.
    - cron: '42 7 * * 1-5'
    - cron: '36 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave-tracker-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calculate completed-session scenarios and push snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach origin/main
            python apps/wave-tracker/update.py
            git add -- tools/wave-tracker/data/latest.json
            if git diff --cached --quiet; then
              echo 'No new snapshot'
              exit 0
            fi
            git commit -m "wave-tracker: update $(date -u +%F)"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Verify production build and snapshot hash
        run: python apps/wave-tracker/verify.py --wait 420
