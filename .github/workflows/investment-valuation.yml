name: 333 index valuation

on:
  schedule:
    # 北京时间 16:25，后续窗口补抓延迟发布的收盘估值。
    - cron: '25 8 * * 1-5'
    - cron: '35 9 * * 1-5'
    - cron: '15 11 * * 1-5'
    - cron: '5 14 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/investment-valuation.yml'
      - 'scripts/update-investment-valuation.mjs'
      - 'lib/investmentValuation.mjs'
      - 'tests/investmentValuation.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-valuation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and fetch closing valuations
        run: |
          npm ci
          node --test tests/investmentValuation.test.mjs
          node scripts/update-investment-valuation.mjs
      - name: Publish changed snapshot
        run: |
          git add tools/investment-theory/valuations.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "333: update closing index valuations"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
